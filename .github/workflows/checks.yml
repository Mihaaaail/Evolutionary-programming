name: Проверка лабораторных
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить библиотеку численных вычислений
        run: python -m pip install -r requirements.txt
      - name: Проверить алгоритмы и сохранённые результаты
        run: python -m unittest discover -s tests -v
